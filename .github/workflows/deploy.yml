# Deploys to Vercel via the CLI using the project owner's token, so commits
# from any collaborator get deployed (Vercel Hobby blocks non-owner authors
# when deploying through the Git integration).
name: Deploy to Vercel

on:
  push:
    branches: ["**"]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set deploy target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "VERCEL_ENV=production" >> "$GITHUB_ENV"
            echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"
            echo "PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
