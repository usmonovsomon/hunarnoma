<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#167a5e" />
    <title>HunarNoma — нет подключения</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #211712;
        background:
          radial-gradient(40rem 40rem at 110% -10%, rgba(27, 163, 116, 0.14), transparent 60%),
          radial-gradient(36rem 36rem at -10% 110%, rgba(221, 111, 22, 0.12), transparent 55%),
          #f8fafc;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 88px; height: 88px; }
      h1 { margin: 20px 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0 0 6px; color: #4a3a32; line-height: 1.5; }
      .alt { font-size: 14px; color: #7a685f; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 14px 24px;
        border-radius: 16px;
        background: #167a5e;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.png" alt="" />
      <h1>Нет подключения к интернету</h1>
      <p>Страницы, которые ты уже открывал, доступны и без сети. Проверь подключение и попробуй снова.</p>
      <p class="alt">Пайвастшавӣ ба интернет нест. · You're offline.</p>
      <a href="/">Попробовать снова</a>
    </main>
  </body>
</html>
